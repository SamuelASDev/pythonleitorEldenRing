name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Locate or install Inno Setup
        shell: pwsh
        run: |
          $compiler = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $compiler = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' | Select-Object -First 1
          }
          if (-not $compiler) { throw 'ISCC.exe não encontrado' }
          "ISCC_PATH=$($compiler.FullName)" >> $env:GITHUB_ENV
      - name: Test and build release
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python scripts/build_release.py --tag "$env:GITHUB_REF_NAME"
          } else {
            python scripts/build_release.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: EntreTerras-Windows-x64
          path: dist/release/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EntreTerras-Windows-x64
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "Entre Terras $RELEASE_TAG" --generate-notes --notes "Instalador Windows x64 e versão portátil. Python incluído; RTSS instalado separadamente. Esta distribuição ainda não possui assinatura Authenticode; o Windows pode exibir avisos. Histórico em %LOCALAPPDATA%\EntreTerras."
